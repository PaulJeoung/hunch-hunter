name: Keep Render Alive (Ping)

on:
  schedule:
    # 5분마다 실행 (UTC 기준)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 즉시 실행 트리거 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          # Render 무료 티어 깨우기 (타임아웃 60초, 실패 시 3회 재시도)
          curl -sS --max-time 60 --retry 3 --retry-delay 5 https://shadow-raiders-api.onrender.com/health || true